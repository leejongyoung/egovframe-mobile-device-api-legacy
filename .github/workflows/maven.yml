name: Java CI with Maven

on:
  push:
    branches: [ "work" ]
  pull_request:
    branches: [ "work" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: web-guide/pom.xml
    - name: Build with Maven
      run: mvn -B package --file web-guide/pom.xml
